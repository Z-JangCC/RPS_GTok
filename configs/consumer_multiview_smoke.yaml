run:
  name: consumer_multiview_smoke
  seed: 2026
  device: cpu

data:
  format: synthetic
  name: synthetic_multiview
  synthetic:
    num_graphs: 36
    num_nodes_min: 8
    num_nodes_max: 18
    families: [cycle, star, tree, motif_mix]
  split:
    train_ratio: 0.7
    val_ratio: 0.15
  bpe:
    merges: 20
    min_freq: 2
  views:
    - rps_gtok_full
    - rps_gtok_compact
    - atomic_program
    - rps_gtok_shuffled
    - rps_gtok_random_ids
    - edge_list_bpe
    - adjacency_list_bpe
    - dfs_order_bpe
    - bfs_order_bpe
    - graph_tokenizer_feuler_bpe

training:
  task_type: classification
  seeds: [2026]
  max_lens: [96]
  batch_size: 8
  epochs: 1
  patience: 1
  grid:
    - name: full_embed_1l32
      model: rps_aware
      dim: 32
      layers: 1
      heads: 4
      dropout: 0.0
      lr: 0.0005
      weight_decay: 0.0001
