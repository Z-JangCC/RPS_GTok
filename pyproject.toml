[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rps-gtok"
version = "0.4.0"
description = "Minimal reproducible RPS_GTok release package for final paper experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "networkx>=3.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "scikit-learn>=1.3",
  "tqdm>=4.66",
  "PyYAML>=6.0",
  "torch>=2.5"
]

[project.scripts]
gptok2-tokenizer = "gptok2_tokenizer.cli:main"
gptok2-eval = "gptok2_evaluation.cli:main"

[tool.setuptools]
packages = {find = {include = ["gptok2", "gptok2.*", "gptok2_compact", "gptok2_compact.*", "gptok2_motif_macro", "gptok2_motif_macro.*", "gptok2_tokenizer", "gptok2_tokenizer.*", "gptok2_evaluation", "gptok2_evaluation.*"]}}

[project.optional-dependencies]
full = [
  "torch-geometric>=2.5",
  "ogb>=1.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
